loadQuality()

/* ==========================================================================
   反向控制：在画面上点击/拖动 → 手机上对应位置
   --------------------------------------------------------------------------
   坐标换算是最容易错的地方，理清一下：

   1. canvas 的**像素**尺寸 = 视频原始分辨率（例如 720×1626）
      canvas 的**显示**尺寸由 CSS max-width/height 约束，可能缩放
   2. 鼠标事件给的是相对于元素的 CSS 像素
   3. 所以：手机坐标 = event 位置 / 显示尺寸 × 视频原始尺寸

   用 getBoundingClientRect() 拿显示尺寸，乘以 canvas.width/height 的比例
   就得到手机上的真实像素坐标。这样无论窗口被缩放到多大都对。
   ========================================================================== */

/** 把鼠标事件坐标换算成手机屏幕像素坐标 */
function toPhoneXY (e) {
  const r = canvas.getBoundingClientRect()
  if (!r.width || !r.height) return null
  // 显示尺寸 → 视频像素尺寸
  const sx = canvas.width / r.width
  const sy = canvas.height / r.height
  return {
    x: Math.round((e.clientX - r.left) * sx),
    y: Math.round((e.clientY - r.top) * sy)
  }
}

let ctlDown = null        // { x, y, t, moved }
let ctlMoved = false
const TAP_MAX_MS = 260    // 按下到抬起短于这个且没移动 → 判定为点击
const MOVE_MIN_PX = 6     // CSS 像素，超过才算拖动

canvas.addEventListener('pointerdown', e => {
  // 左键才控制，右键留给菜单（将来可以放返回键）
  if (e.button !== 0) return
  const p = toPhoneXY(e)
  if (!p) return

  e.preventDefault()
  ctlDown = { x: p.x, y: p.y, t: Date.now() }
  ctlMoved = false
  $('stage').classList.add('ctl-active')
  try { canvas.setPointerCapture(e.pointerId) } catch {}

  /**
   * ══════════ 按下即发，不等抬起 ══════════
   *
   * 原来的逻辑是「pointerup 时才判断是 tap / swipe / 长按」，
   * 意味着用户按下去到抬手这段时间，手机端完全没收到任何指令。
   * 抬手快的话还好，抬手慢（或者手指有点停顿）就会明显感觉「点了没反应」。
   *
   * 现在改成：按下立刻发一次 tap，让手机立即响应。
   * 如果后续判定为拖动，再补一个 swipe —— 因为 swipe 的第一帧就是
   * 从按下点开始，覆盖上去视觉上是连续的，不会有「先点后拖」的割裂感。
   *
   * 长按仍走长按分支：按下时先发了 tap，长按会额外触发一次
   * longPress，Android 上表现为「点了一下然后长按」——
   * 对绝大多数 App 而言（菜单、放大、复制）行为是一致的。
   */
  const optimisticTap = { sent: true, at: Date.now() }
  window.api.ctlTap({ x: p.x, y: p.y })

  const startClientX = e.clientX
  const startClientY = e.clientY

  const move = ev => {
    if (!ctlDown) return
    const dx = ev.clientX - startClientX
    const dy = ev.clientY - startClientY
    if (!ctlMoved && Math.hypot(dx, dy) > MOVE_MIN_PX) ctlMoved = true
  }

  const finish = ev => {
    canvas.removeEventListener('pointermove', move)
    canvas.removeEventListener('pointerup', finish)
    canvas.removeEventListener('pointercancel', finish)
    $('stage').classList.remove('ctl-active')

    if (!ctlDown) return
    const down = ctlDown
    ctlDown = null

    const p2 = toPhoneXY(ev)
    const heldMs = Date.now() - down.t

    if (ctlMoved && p2) {
      /**
       * 拖动 / 滑动。
       *
       * 只在抬起时发一次 swipe，而不是每次 pointermove 都发。
       * 原因：一次 adb input 要 fork 进程，约 30ms 往返，
       * 60fps 拖动意味着每帧都要发 —— 队列会瞬间堆满，操作变成几秒前的回放。
       * adb swipe 支持时长参数，系统自己插值，观感反而更顺。
       */
      window.api.ctlSwipe({
        x1: down.x, y1: down.y,
        x2: p2.x, y2: p2.y,
        ms: Math.min(1200, Math.max(80, heldMs))
      })
    } else if (heldMs >= 650) {
      // 按住不动 650ms 以上 → 长按
      window.api.ctlLongPress({ x: down.x, y: down.y, ms: Math.min(3000, heldMs) })
    } else {
      /**
       * 普通点击不再重发 —— 按下时已经发过了（optimisticTap）。
       *
       * 只在「按下的位置和抬起的位置有偏移」这种少见情况下补发，
       * 保证点到的确实是用户最终松开的那一点。
       */
      if (optimisticTap.sent) {
        const dx = Math.abs(p2 ? p2.x - down.x : 0)
        const dy = Math.abs(p2 ? p2.y - down.y : 0)
        if (p2 && (dx > 8 || dy > 8)) {
          window.api.ctlTap({ x: p2.x, y: p2.y })
        }
      }
    }
  }

  canvas.addEventListener('pointermove', move)
  canvas.addEventListener('pointerup', finish)
  canvas.addEventListener('pointercancel', finish)
})

/**
 * 滚轮 → 手机滚动。
 *
 * 用 scrcpy 的 inject_scroll 而不是伪造一段 swipe：
 *   - scroll 是原生滚动事件，系统会带惯性，手感接近触控板
 *   - swipe 是「手指滑动」，在长列表里会变成快速甩动，不好控制
 *
 * vscroll 正值向下。滚轮向下滚（deltaY > 0）对应内容往下走，
 * 所以直接用 deltaY 归一化后的值，符号一致。
 */
let wheelAcc = 0
let wheelTimer = null
canvas.addEventListener('wheel', e => {
  e.preventDefault()

  const r = canvas.getBoundingClientRect()
  if (!r.width) return
  // 用鼠标位置作为滚动锚点，而不是画面中心 —— 更符合直觉
  const p = toPhoneXY(e)
  if (!p) return

  /**
   * 累积 + 节流。
   *
   * 鼠标滚轮一格通常 deltaY = ±100，一次发一格会太碎，
   * 而触摸板一次滑动会连发几十个事件，逐个发又会把通道打满。
   * 这里把 120ms 内的滚动量累加，一次性发出去。
   */
  wheelAcc += e.deltaY
  if (wheelTimer) return
  wheelTimer = setTimeout(() => {
    const v = Math.max(-30, Math.min(30, -wheelAcc / 40))
    wheelAcc = 0
    wheelTimer = null
    if (Math.abs(v) >= 1) {
      window.api.ctlScroll({ x: p.x, y: p.y, hx: 0, vy: v })
    }
  }, 120)
}, { passive: false })

/**
 * 键盘输入。
 *
 * 只在窗口聚焦、且画面上一次被点过之后才转发，
 * 否则用户按 Esc 退出、按快捷键调设置都会被当成手机输入。
 */
let ctlFocus = false
canvas.addEventListener('pointerdown', () => { ctlFocus = true })
document.addEventListener('pointerdown', e => {
  if (!e.target.closest('#video')) ctlFocus = false
})

const KEY_MAP = {
  Backspace: 'KEYCODE_DEL',
  Enter: 'KEYCODE_ENTER',
  Escape: 'KEYCODE_BACK',
  ArrowUp: 'KEYCODE_DPAD_UP',
  ArrowDown: 'KEYCODE_DPAD_DOWN',
  ArrowLeft: 'KEYCODE_DPAD_LEFT',
  ArrowRight: 'KEYCODE_DPAD_RIGHT',
  Home: 'KEYCODE_HOME',
  Tab: 'KEYCODE_TAB'
}

document.addEventListener('keydown', e => {
  if (!ctlFocus) return
  if (e.ctrlKey || e.altKey || e.metaKey) return

  if (KEY_MAP[e.key]) {
    e.preventDefault()
    window.api.ctlKey(KEY_MAP[e.key])
    return
  }
  // 单个可见字符：交给 adb input text
  if (e.key.length === 1) {
    e.preventDefault()
    window.api.ctlText(e.key)
  }
})

// 主进程回报的控制提示
if (window.api.onCtlMsg) {
  window.api.onCtlMsg(d => {
    if (d) addLocalLog(d.level || 'info', d.text || String(d))
  })
}

/* WiFi 一键自动连接：缓存 → mDNS → 网段扫描，不用手输 IP、不用扫码。
   换一台手机也能用：只要它和电脑在同一个 WiFi，并且开发者选项里开过
   无线调试（或 USB 插过一次执行 adb tcpip 5555），这里会自动发现并连上。 */
$('btnWifi').addEventListener('click', async () => {
  const btn = $('btnWifi')
  if (btn.dataset.busy === '1') return
  btn.dataset.busy = '1'
  setDot('wait')
  $('phTitle').textContent = '正在查找手机…'
  $('phBody').textContent = '扫描同一 WiFi 下的设备'
  placeholder.style.display = 'flex'
  addLocalLog('info', 'WiFi 自动连接：开始发现设备')

  try {
    const r = await window.api.quickWifi()
    if (!r || !r.ok) {
      setDot('err')
      $('phTitle').textContent = '没找到手机'
      $('phBody').textContent = (r && r.error) || '确认手机和电脑在同一个 WiFi'
      addLocalLog('error', 'WiFi 自动连接失败: ' + ((r && r.error) || '未知错误'))
      return
    }

    addLocalLog('ok', `WiFi 已连上 ${r.target}（来源 ${r.via}，耗时 ${r.took}ms）`)
    $('phTitle').textContent = '已连接 ' + r.target
    $('phBody').textContent = '正在建立投屏通道'

    if (state.streaming) await window.api.stopStream()
    framesDecoded = 0
    destroyDecoder()
    state.streaming = false

    const s = await window.api.startStream({})
    if (!s || !s.ok) {
      setDot('err')
      $('phTitle').textContent = '连上了但投屏失败'
      $('phBody').textContent = (s && s.error) || '未知错误'
      addLocalLog('error', '投屏启动失败: ' + ((s && s.error) || '未知错误'))
    } else {
      state.streaming = true
      $('phTitle').textContent = '等待首帧…'
      $('phBody').textContent = '通道已建立，马上出画面'
    }
  } catch (e) {
    setDot('err')
    $('phTitle').textContent = 'WiFi 连接异常'
    $('phBody').textContent = e.message || String(e)
    addLocalLog('error', 'WiFi 连接异常: ' + (e.message || e))
  } finally {
    btn.dataset.busy = ''
  }
})

/* 重新连接：断开当前会话再连一次。
   之前这个按钮是「开始投屏/停止」二态，很误导 —— 迷你窗打开时
   画面本来就是自动开始投的，用户不需要再点一次。 */
$('btnStart').addEventListener('click', async () => {
  const btn = $('btnStart')
  if (btn.dataset.busy === '1') return
  btn.dataset.busy = '1'

  setDot('wait')
  $('phTitle').textContent = '正在重新连接…'
  $('phBody').textContent = '稍等，正在断开旧会话'
  placeholder.style.display = 'flex'
  addLocalLog('info', '手动重新连接')

  try {
    if (state.streaming) await window.api.stopStream()
    framesDecoded = 0
    destroyDecoder()
    state.streaming = false

    $('phTitle').textContent = '正在连接手机…'
    $('phBody').textContent = '检查设备授权状态'
    const r = await window.api.startStream({})

    if (!r || !r.ok) {
      setDot('err')
      // 失败原因直接写在占位层上 —— 之前是弹日志抽屉，
      // 但那个抽屉已经去掉了，而且把原因摆在画面中央比弹面板更直白
      $('phTitle').textContent = '连接失败'
      $('phBody').textContent = (r && r.error) || '未知错误'
      placeholder.style.display = 'flex'
      addLocalLog('error', '重连失败: ' + ((r && r.error) || '未知错误'))
    } else {
      state.streaming = true
      $('phTitle').textContent = '等待首帧…'
      $('phBody').textContent = '通道已建立，马上出画面'
    }
  } catch (e) {
    setDot('err')
    $('phTitle').textContent = '连接失败'
    $('phBody').textContent = e.message
    addLocalLog('error', '重连异常: ' + e.message)
  } finally {
    delete btn.dataset.busy
  }
})

window.addEventListener('wheel', e => {
  if (!e.ctrlKey && !e.altKey) return
  e.preventDefault()
  window.api.scale(e.deltaY < 0 ? 1.06 : 0.94)
}, { passive: false })

/* ============ 初始化 ============ */
/**
 * 先用默认值把 UI 画出来（不回写主进程），等拿到真实状态后再同步一次。
 *
 * 之前的问题：paintOpacity() 无条件调用 setOpacity()，初始化那一拍
 * 用的还是默认/残留值，直接把主进程的配置覆盖掉 —— 表现为
 * 每次启动透明度都变成上一次测试残留的数字（实测 16%）。
 */
paintOpacity(false)
renderSize()

window.api.state().then(s => {
  state.contentOp = typeof s.contentOp === 'number' ? s.contentOp : 1
  state.bgOp = typeof s.bgOp === 'number' ? s.bgOp : 1
  state.ratioLock = s.ratioLock !== false
  /**
   * 置顶默认关。
   *
   * 原来的写法是 `s.pinned !== false` —— 也就是「只要不是明确的 false 就当 true」。
   * 老配置文件里没有这个字段时会被判成 true，用户明明没开过置顶，
   * 窗口却一直压在别的程序上面（而且他自己不知道为什么）。
   * 现在只有主进程明确给了 true 才置顶。
   */
  state.pinned = s.pinned === true
  liveSize = { w: s.w, h: s.h }
  $('btnRatio').classList.toggle('on', state.ratioLock)
  paintPin()
  // 这里也不回写：值本来就从主进程来，写回去纯属多余且有竞态
  paintOpacity(false)
  renderSize()
}).catch(() => {
  addLocalLog('warn', '读取窗口状态失败，使用默认值')
})

/* ════════ WiFi 模式：手机 App 推流，从 HTTP 源拉帧 ════════ */
/**
 * 与 scrcpy 模式的区别：
 *   - 数据来自本地 HTTP（wifi-receiver.js），不走 adb reverse
 *   - config 用 JSON 拿（codecString + description 字节数组）
 *   - 帧是裸 AVCC（length-prefixed），直接喂解码器
 *   - 拉帧用「带版本号的轮询」：receiver 有新帧才返回 200，没有就 204，
 *     这样不会空转，也不会积压
 */
let wifiRunning = false
/** 音频播放器实例（WiFi 模式才有） */
let wifiAudio = null

window.api.onWifiStart(({ source }) => {
  if (wifiRunning) return
  wifiRunning = true
  addLocalLog('info', 'WiFi 模式启动: ' + source)

  /**
   * 启动音频（与视频并行，互不阻塞）。
   *
   * ── 为什么要重试 ──
   *
   * AudioSpecificConfig 是手机端音频编码器启动时发的一次性包。
   * 如果接收端刚好在那之后才启动（很常见：先开窗口再让手机连，
   * 或者中途重启过接收端），配置就永远收不到了 ——
   * 此时 /audio-config 返回 204，渲染层会直接放弃，
   * 结果是「有声音数据在传但电脑一直没声」。
   *
   * 现在改成轮询等待：最多等 20 秒，每 500ms 试一次。
   * 手机重连时会补发配置（见 StreamEngine 的 audioCfgChunk），
   * 所以只要能等到那一刻就能自动恢复。
   */
  ;(async () => {
    try {
      const mod = await import('./wifi-audio.js')
      if (wifiAudio) { try { await wifiAudio.stop() } catch {} }

      const audio = new mod.WifiAudio(source)
      audio.onLog((lv, msg) => addLocalLog(lv, '音频: ' + msg))

      let r = null
      for (let i = 0; i < 40; i++) {
        r = await audio.start()
        if (r.ok) break
        if (r.error !== 'no-audio') break      // 真错误就别重试了
        await new Promise(z => setTimeout(z, 500))
      }

      if (!r || !r.ok) {
        addLocalLog('warn', '没有音频: ' + ((r && r.error) || '未知'))
        try { await audio.stop() } catch {}
        return
      }

      // 应用用户上次设置的音量
      try {
        const saved = parseFloat(localStorage.getItem('mw:vol') || '1')
        audio.setVolume(Number.isFinite(saved) ? saved : 1)
      } catch {}

      wifiAudio = audio
      addLocalLog('ok', '音频已开启')
    } catch (e) {
      addLocalLog('warn', '音频模块加载失败: ' + e.message)
    }
  })()

  ;(async () => {
    try {
      // 1. 拿 config
      const cfg = await fetch(source + '/config').then(r => r.json())
      if (!cfg.ok || !cfg.codecString) {
        addLocalLog('error', 'WiFi 源没有 config')
        return
      }
      const descBytes = cfg.description ? new Uint8Array(cfg.description) : null
      addLocalLog('ok', 'codec ' + cfg.codecString)

      state.videoSize = cfg.videoSize || { w: 720, h: 1600 }
      state.codecString = cfg.codecString
      if (!ensureDecoder(cfg.codecString, state.videoSize.w, state.videoSize.h, descBytes)) {
        addLocalLog('error', 'WiFi 模式解码器配置失败')
        return
      }

      /**
       * 3. 先取关键帧补位。
       *
       * configure() 之后解码器必须先吃一个 IDR 才能解 delta 帧。
       * 而 /frame 只保留最新一帧，2 秒才出现一次的 IDR 很容易被轮询错过
       * → 一直 decoded=0、画面空白。所以先单独拿 lastKey 喂进去。
       */
      let gotKey = false
      for (let i = 0; i < 30 && wifiRunning && !gotKey; i++) {
        try {
          const rk = await fetch(source + '/keyframe', { cache: 'no-store' })
          if (rk.status === 200) {
            const kb = new Uint8Array(await rk.arrayBuffer())
            if (kb.length > 4 && (kb[4] & 0x1f) === 5) {
              feedFrame({ data: kb, pts: Date.now() * 1000, key: true, codecString: cfg.codecString })
              gotKey = true
              addLocalLog('ok', 'WiFi 关键帧已补位')
              break
            }
          }
        } catch (e) { /* 还没收到 IDR，稍后重试 */ }
        await new Promise(z => setTimeout(z, 400))
      }
      if (!gotKey) addLocalLog('warn', '暂时没拿到关键帧，等下一个 IDR')

      /**
       * 4. 拉帧循环 —— 长轮询 /frames，按 seq 顺序喂。
       *
       * 两个关键点：
       *
       * (a) 批量：一次取最多 12 帧。轮询慢于编码时会跳过中间的 P 帧，
       *     而 H.264 的 P 帧靠前序帧预测 —— 跳一帧就是参考图全错，
       *     屏幕上出现绿块/残影，也就是花屏。批量取能保证顺序完整。
       *
       * (b) 长轮询：wait=800 让服务端在没帧时把请求挂起，
       *     一有帧进来立刻返回。之前是「立刻回 204 → 再发一次」的空转，
       *     每个往返 3~8ms，30fps 下白白吃掉大量时间窗，
       *     实测帧率在 0/63/4 之间乱跳。现在没有无效往返。
       */
      const tgt = source + '/frames?n=12&wait=800'
      let fail = 0
      let lastSeq = -1
      let serverDropped = 0
      startWatchdog()
      while (wifiRunning) {
        try {
          const r = await fetch(tgt, { cache: 'no-store' })
          // 204 = 服务端等满 800ms 也没有新帧，正常情况，直接下一轮
          if (r.status === 204) continue
          if (!r.ok) throw new Error('HTTP ' + r.status)

          const buf = await r.arrayBuffer()
          fail = 0

          /**
           * 服务端丢过帧 → 参考链已断。
           *
           * 接收端队列满会丢掉最旧的帧（见 wifi-receiver.js 的 90 帧上限）。
           * 一旦发生，继续喂后面的 P 帧只会解出错位的画面，
           * 所以这里主动丢掉手里的、置 gotKey=false，
           * 等下一个 IDR 重新起头 —— 画面会短暂一顿，然后干净恢复。
           */
          const dropped = Number(r.headers.get('x-dropped') || 0)
          if (dropped > serverDropped) {
            serverDropped = dropped
            gotKey = false
            addLocalLog('warn', '接收端丢帧 ' + dropped + '，等下一个关键帧重新同步')
            await new Promise(z => setTimeout(z, 30))
            continue
          }

          const dv = new DataView(buf)
          const count = dv.getUint32(0)
          let off = 4
          for (let i = 0; i < count; i++) {
            const seq = dv.getUint32(off); off += 4
            const len = dv.getUint32(off); off += 4
            const frameData = new Uint8Array(buf, off, len)
            off += len

            // 乱序保护：已经喂过的 seq 直接跳过
            if (seq <= lastSeq) continue
            lastSeq = seq

            const nalType = len > 4 ? (frameData[4] & 0x1f) : 0
            const isKey = nalType === 5
            if (!gotKey) {
              if (!isKey) continue
              gotKey = true
              addLocalLog('ok', 'WiFi 关键帧到达')
            }
            feedFrame({
              data: frameData,
              pts: Date.now() * 1000,
              key: isKey,
              codecString: cfg.codecString
            })
          }
        } catch (e) {
          if (++fail > 5) {
            addLocalLog('error', 'WiFi 拉流失败: ' + e.message)
            break
          }
          await new Promise(z => setTimeout(z, 500))
        }
      }
      addLocalLog('warn', 'WiFi 拉流退出')
      stopWatchdog()
    } catch (e) {
      addLocalLog('error', 'WiFi 模式异常: ' + e.message)
    }
  })()
})
</script>
</body>
</html>
